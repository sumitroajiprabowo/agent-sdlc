<text x="380" y="25" text-anchor="middle" fill="#8b949e" style="font-size:12px">sdlc-kit — plan → code → QA → ship · multi-model team</text>
<text class="l0" x="28" y="96" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#c9d1d9">npx sdlc-kit --claude --optimize</tspan></text>
<text class="l1" x="28" y="122" xml:space="preserve"><tspan fill="#3fb950">✔ </tspan><tspan fill="#c9d1d9">2 skills · 10 slash commands (/sdlc-*) · 2 subagents</tspan></text>
<text class="l2" x="28" y="148" xml:space="preserve"><tspan fill="#3fb950">✔ </tspan><tspan fill="#c9d1d9">opusplan · 200k cap · statusline (ctx %, cost, tokens)</tspan></text>
<text class="l3" x="28" y="174" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-spec </tspan><tspan fill="#c9d1d9">"billing export"</tspan></text>
<text class="l4" x="28" y="200" xml:space="preserve"><tspan fill="#d29922">  ⏸ </tspan><tspan fill="#c9d1d9">Spec saved. Approve, revise, or cancel?</tspan></text>
<text class="l5" x="28" y="226" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#c9d1d9">approve  </tspan><tspan fill="#3fb950">✔ Status: approved</tspan></text>
<text class="l6" x="28" y="252" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-start </tspan><tspan fill="#c9d1d9">#12  </tspan><tspan fill="#8b949e">→ size M, plan saved to .claude/tasks/</tspan></text>
<text class="l7" x="28" y="278" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-review </tspan><tspan fill="#8b949e">→ </tspan><tspan fill="#3fb950">VERDICT: APPROVE</tspan></text>
<text class="l8" x="28" y="304" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-qa </tspan><tspan fill="#8b949e">→ </tspan><tspan fill="#3fb950">lint PASS · unit PASS · api PASS</tspan></text>
<text class="l9" x="28" y="330" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-ship </tspan><tspan fill="#8b949e">→ </tspan><tspan fill="#3fb950">PR opened ✔</tspan></text>
<text class="l10" x="28" y="356" xml:space="preserve"><tspan fill="#58a6ff">&gt; </tspan><tspan fill="#bc8cff">/sdlc-start-orchestration </tspan><tspan fill="#c9d1d9">"billing export"</tspan></text>
<text class="l11" x="28" y="382" xml:space="preserve"><tspan fill="#8b949e">  roster: </tspan><tspan fill="#c9d1d9">tech-lead </tspan><tspan fill="#8b949e">claude · </tspan><tspan fill="#c9d1d9">backend </tspan><tspan fill="#8b949e">agy · </tspan><tspan fill="#c9d1d9">frontend </tspan><tspan fill="#8b949e">codex · </tspan><tspan fill="#c9d1d9">qa </tspan><tspan fill="#8b949e">opencode</tspan></text>
<text class="l12" x="28" y="408" xml:space="preserve"><tspan fill="#8b949e">  design-review → </tspan><tspan fill="#c9d1d9">2 OBJECTION </tspan><tspan fill="#8b949e">→ </tspan><tspan fill="#c9d1d9">DECISION </tspan><tspan fill="#8b949e">· 1 </tspan><tspan fill="#d29922">DISSENT #3</tspan></text>
<text class="l13" x="28" y="434" xml:space="preserve"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">check-run: 0 errors  </tspan><tspan fill="#d29922">⏸ </tspan><tspan fill="#c9d1d9">gate-design: approve, rerun, or send back?</tspan></text>
<text class="l14" x="28" y="460" xml:space="preserve"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">backend · frontend · review · security · qa </tspan><tspan fill="#3fb950">PASS</tspan><tspan fill="#d29922">  ⏸ </tspan><tspan fill="#c9d1d9">gate-accept</tspan></text>
<text class="l15" x="28" y="486" xml:space="preserve"><tspan fill="#8b949e">~/app  </tspan><tspan fill="#d29922">ctx 72% (/sdlc-handoff)</tspan><tspan fill="#8b949e">  $0.42  in 120k/out 8k  </tspan><tspan fill="#8b949e">Opus</tspan></text>
